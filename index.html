<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ARTOFIX 2.3</title>
<style>

/* =========================================
   DESIGN TOKENS — светлая «дневная» тема
   (без неона и киберпанка: мягкие поверхности,
   один акцент, деликатные тени)
   ========================================= */
:root {
  --ac:   #4f46e5;   /* индиго */
  --acr:  79,70,229;
  --ac2:  #8b5cf6;   /* мягкий фиолет — компаньон */
  --ac2r: 139,92,246;
  --grn:  #16a34a;  --grnr: 22,163,74;
  --red:  #e5484d;  --redr: 229,72,77;
  --ylw:  #d97706;  --ylwr: 217,119,6;

  --bg:   #edf0f7;
  --panel:#f7f8fc;
  --card: #ffffff;
  --card-br: #e4e8f1;
  --divider: #eceff6;

  --tx:   #1d2436;   /* основной текст */
  --tx2:  #5d6779;   /* вторичный */
  --tx3:  #98a1b3;   /* приглушённый */

  --btn-soft: #eef1f8;
  --input-bg: #f4f6fb;
  --row-hover: rgba(29,36,54,.045);

  --font: 'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono: 'Cascadia Code',Consolas,'Courier New',monospace;
  --radius: 16px;
  --sidebar-w: 232px;
}

/* ── АЦЕНТНЫЕ ТЕМЫ (светлые) ── */
body.th-mint  { --ac:#059669; --acr:5,150,105;   --ac2:#14b8a6; --ac2r:20,184,166;  }
body.th-sky   { --ac:#0284c7; --acr:2,132,199;   --ac2:#38bdf8; --ac2r:56,189,248;  }
body.th-amber { --ac:#d97706; --acr:217,119,6;   --ac2:#f59e0b; --ac2r:245,158,11;  }
body.th-rose  { --ac:#e11d48; --acr:225,29,72;   --ac2:#f472b6; --ac2r:244,114,182; }

/* ── ТЕМНАЯ ТЕМА «НОЧЬ» — чистый тёмный, без неона ── */
body.th-night {
  --bg:#0d1320; --panel:#111827; --card:#161f31;
  --card-br:#243049; --divider:#1c2537;
  --tx:#e7ecf5; --tx2:#94a0b6; --tx3:#5f6c85;
  --ac:#8195f8; --acr:129,149,248; --ac2:#b39dfb; --ac2r:179,157,251;
  --grn:#34d399; --grnr:52,211,153;
  --red:#f2636a; --redr:242,99,106;
  --ylw:#f4bf55; --ylwr:244,191,85;
  --btn-soft:#1d2839; --input-bg:#0f1729; --row-hover:rgba(231,236,245,.055);
}

/* =========================================
   RESET
   ========================================= */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  color:var(--tx); font-family:var(--font); font-size:13px;
}
body {
  background:
    radial-gradient(1100px 460px at 80% -10%, rgba(var(--acr),.075), transparent 62%),
    radial-gradient(900px 420px at -12% 110%, rgba(var(--ac2r),.055), transparent 60%),
    var(--bg);
  transition: background .35s ease;
}
button  { cursor:pointer; font-family:var(--font); color:inherit; }
input, select, textarea { font-family:var(--mono); user-select:text; cursor:text; color:var(--tx); }
select  { cursor:pointer; }
::selection { background:rgba(var(--acr),.22); }
:focus-visible { outline:2px solid rgba(var(--acr),.55); outline-offset:2px; }

/* =========================================
   APP SHELL
   ========================================= */
#app {
  position:relative; z-index:2; width:100vw; height:100vh;
  background:var(--bg); display:flex; flex-direction:column;
  animation: appBoot .45s cubic-bezier(.22,1,.36,1) both;
}
@keyframes appBoot {
  from { opacity:0; transform:translateY(10px) scale(.99); }
  to   { opacity:1; transform:translateY(0)    scale(1);   }
}

/* =========================================
   TITLEBAR
   ========================================= */
#titlebar {
  height:48px; flex-shrink:0;
  background:var(--panel);
  border-bottom:1px solid var(--divider);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 14px 0 18px; -webkit-app-region:drag;
  position:relative; z-index:10;
}

#logo {
  display:flex; align-items:center; gap:10px; -webkit-app-region:no-drag;
  font-weight:700; font-size:13px; letter-spacing:1.6px; cursor:default; user-select:none;
}
#logo-box {
  width:30px; height:30px; border-radius:9px;
  background:linear-gradient(135deg, rgba(var(--acr),.16), rgba(var(--ac2r),.16));
  border:1px solid rgba(var(--acr),.25);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#logo-box img { display:block; }
.logo-accent {
  font-size:10px; font-weight:700; letter-spacing:.5px;
  padding:3px 8px; border-radius:20px; margin-left:2px;
  background:rgba(var(--acr),.1); color:var(--ac);
}

#winbtns { -webkit-app-region:no-drag; display:flex; gap:4px; align-items:center; }
.winbtn {
  width:28px; height:28px; border-radius:8px;
  background:transparent; border:1px solid transparent;
  color:var(--tx3); font-size:12px;
  display:flex; align-items:center; justify-content:center;
  transition:all .16s; cursor:pointer;
}
.winbtn:hover { background:var(--btn-soft); color:var(--tx); }
#winbtn-close:hover {
  background:rgba(var(--redr),.1); border-color:rgba(var(--redr),.25); color:var(--red);
}

/* =========================================
   LAYOUT
   ========================================= */
#main-layout { display:flex; flex:1; overflow:hidden; }

/* =========================================
   SIDEBAR
   ========================================= */
#sidebar {
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--divider);
  display:flex; flex-direction:column;
  padding:14px 12px 12px; gap:2px;
}

.nav-sep {
  font-size:9.5px; letter-spacing:1.8px; color:var(--tx3);
  padding:12px 10px 6px; text-transform:uppercase; font-weight:700;
}

.nav-btn {
  padding:9px 12px; border-radius:10px; background:transparent;
  color:var(--tx2); border:1px solid transparent;
  font-weight:600; font-size:12.5px; text-align:left;
  display:flex; align-items:center; gap:10px;
  transition:all .16s; width:100%;
}
.nav-btn .nav-icon { font-size:14px; flex-shrink:0; opacity:.9; transition:transform .2s; }
.nav-btn:hover { background:var(--row-hover); color:var(--tx); }
.nav-btn:hover .nav-icon { transform:scale(1.1); }
.nav-btn.is-active {
  background:rgba(var(--acr),.1);
  color:var(--ac); border-color:rgba(var(--acr),.14);
}
.nav-btn.is-active .nav-icon { opacity:1; }

/* =========================================
   STATUS BOX (sidebar bottom)
   ========================================= */
#status-box {
  margin-top:auto; padding:13px;
  background:var(--card); border-radius:14px;
  border:1px solid var(--card-br);
  box-shadow:0 1px 2px rgba(20,24,44,.04);
}
.status-row { display:flex; align-items:center; gap:9px; margin-bottom:11px; }

#zapret-dot {
  width:10px; height:10px; border-radius:50%;
  background:#c7cdd9; flex-shrink:0; transition:all .4s;
}
body.th-night #zapret-dot { background:#39445c; }
#zapret-dot.is-on {
  background:var(--grn);
  animation:dotPulse 2.2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(var(--grnr),.35); }
  50%     { transform:scale(1.15); box-shadow:0 0 0 5px rgba(var(--grnr),0); }
}

#zapret-label {
  font-size:9.5px; letter-spacing:2px; color:var(--tx3); font-weight:700; transition:.3s;
}
#zapret-label.is-on { color:var(--grn); }

.status-btn {
  display:block; width:100%; padding:10px; border:none; border-radius:10px;
  font-size:10.5px; letter-spacing:.8px; font-weight:700; text-transform:uppercase;
  font-family:var(--font); margin-bottom:6px; transition:all .18s; cursor:pointer;
}
.status-btn:last-child { margin-bottom:0; }

.sb-start {
  background:var(--ac); color:#fff;
  box-shadow:0 1px 2px rgba(var(--acr),.3);
}
.sb-start:hover { filter:brightness(1.08); box-shadow:0 4px 14px rgba(var(--acr),.3); transform:translateY(-1px); }
.sb-start:active { transform:none; }

.sb-stop {
  background:transparent; color:var(--red);
  border:1px solid rgba(var(--redr),.32);
}
.sb-stop:hover { background:rgba(var(--redr),.07); border-color:rgba(var(--redr),.5); }

/* =========================================
   CONTENT AREA
   ========================================= */
#content-area {
  flex:1; padding:26px 30px; overflow-y:auto; scroll-behavior:smooth;
}
#content-area::-webkit-scrollbar { width:10px; }
#content-area::-webkit-scrollbar-track { background:transparent; }
#content-area::-webkit-scrollbar-thumb { background:var(--card-br); border-radius:6px; border:3px solid var(--bg); }
#content-area::-webkit-scrollbar-thumb:hover { background:var(--tx3); }

.tab-page { animation:tabIn .3s cubic-bezier(.22,1,.36,1) both; }
@keyframes tabIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* =========================================
   TYPOGRAPHY
   ========================================= */
.page-title {
  font-size:17px; font-weight:700; letter-spacing:.2px; color:var(--tx);
  margin-bottom:22px; display:flex; align-items:center; gap:11px;
}
.page-title .page-title-accent { font-size:17px; }
.page-title-line {
  flex:1; height:1px; background:var(--divider);
}

.section-title {
  font-size:11px; letter-spacing:.6px; color:var(--tx2); text-transform:uppercase;
  font-weight:700; margin-bottom:13px; display:flex; align-items:center; gap:8px;
}
.section-title::before {
  content:''; width:6px; height:6px; border-radius:50%;
  background:var(--ac); flex-shrink:0;
}

.field-label {
  font-size:11px; color:var(--tx2); font-weight:600;
  display:block; margin-bottom:6px;
}

/* =========================================
   GRIDS
   ========================================= */
.grid-auto { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.grid-2    { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3    { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }

/* =========================================
   CARDS
   ========================================= */
.af-card {
  background:var(--card); border:1px solid var(--card-br);
  border-radius:var(--radius); padding:18px;
  box-shadow:0 1px 2px rgba(20,24,44,.04);
  transition:border-color .22s, transform .22s, box-shadow .22s;
}
.af-card:hover {
  border-color:rgba(var(--acr),.35);
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(20,24,44,.08);
}

/* =========================================
   BUTTONS
   ========================================= */
.btn {
  display:inline-block; padding:9px 16px; border:none; border-radius:10px;
  font-size:11.5px; font-weight:700; letter-spacing:.4px;
  font-family:var(--font); transition:all .18s; cursor:pointer;
  border:1px solid transparent;
}
.btn:disabled { opacity:.45; pointer-events:none; }

.btn-primary {
  background:var(--ac); color:#fff;
  box-shadow:0 1px 2px rgba(var(--acr),.3);
}
.btn-primary:hover {
  filter:brightness(1.08);
  box-shadow:0 4px 16px rgba(var(--acr),.32);
  transform:translateY(-1px);
}
.btn-primary:active { transform:none; box-shadow:0 1px 2px rgba(var(--acr),.3); }

.btn-secondary {
  background:var(--btn-soft); color:var(--tx);
  border-color:var(--card-br);
}
.btn-secondary:hover {
  background:var(--row-hover); border-color:var(--tx3);
  transform:translateY(-1px);
}

.btn-danger {
  background:rgba(var(--redr),.07); color:var(--red);
  border-color:rgba(var(--redr),.3);
}
.btn-danger:hover { background:rgba(var(--redr),.14); border-color:rgba(var(--redr),.5); transform:translateY(-1px); }

.btn-glow {
  background:rgba(var(--acr),.08); color:var(--ac);
  border-color:rgba(var(--acr),.38);
}
.btn-glow:hover { background:rgba(var(--acr),.15); border-color:rgba(var(--acr),.6); transform:translateY(-1px); }

.btn-full { width:100%; display:block; text-align:center; margin-bottom:8px; }
.btn-full:last-child { margin-bottom:0; }

/* =========================================
   INPUTS
   ========================================= */
.af-input {
  width:100%; padding:10px 12px; border-radius:10px;
  border:1px solid var(--card-br);
  background:var(--input-bg); color:var(--tx); font-size:12.5px;
  outline:none; transition:all .18s;
  display:block; margin-bottom:9px;
}
.af-input:focus {
  border-color:var(--ac);
  background:var(--card);
  box-shadow:0 0 0 3px rgba(var(--acr),.14);
}
.af-input::placeholder { color:var(--tx3); }
select.af-input { cursor:pointer; }
select.af-input option { background:var(--card); color:var(--tx); }

/* =========================================
   DATA ROWS
   ========================================= */
.data-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 0; border-bottom:1px solid var(--divider);
}
.data-row:last-child { border-bottom:none; }
.data-label { color:var(--tx2); font-size:11.5px; font-weight:600; }
.data-value { color:var(--tx); font-weight:700; font-size:12px; }

/* =========================================
   PROFILE CARDS
   ========================================= */
.profile-card {
  background:var(--card); border:1px solid var(--card-br);
  border-radius:14px; padding:14px;
  display:flex; align-items:center; gap:13px;
  box-shadow:0 1px 2px rgba(20,24,44,.04);
  transition:all .2s; cursor:pointer;
}
.profile-card:hover {
  border-color:rgba(var(--acr),.4);
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(20,24,44,.08);
}

.profile-ava {
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  background:rgba(var(--acr),.09);
  border:1px solid rgba(var(--acr),.18);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; transition:transform .2s;
}
.profile-card:hover .profile-ava { transform:scale(1.05); }
.profile-name { font-size:13.5px; font-weight:700; margin-bottom:2px; color:var(--tx); }
.profile-meta { font-size:10.5px; color:var(--tx3); font-family:var(--mono); }
.profile-del {
  margin-left:auto; width:28px; height:28px; border-radius:8px; flex-shrink:0;
  background:transparent; border:1px solid transparent;
  color:var(--tx3); font-size:13px;
  display:flex; align-items:center; justify-content:center; transition:.16s; cursor:pointer;
}
.profile-del:hover { background:rgba(var(--redr),.1); border-color:rgba(var(--redr),.25); color:var(--red); }

.profile-add {
  border:1.5px dashed var(--card-br); border-radius:14px;
  padding:20px; display:flex; align-items:center; justify-content:center;
  gap:10px; color:var(--tx3); font-size:11.5px; font-weight:600;
  transition:all .2s; cursor:pointer; min-height:72px;
  flex-direction:column; background:transparent;
}
.profile-add:hover {
  border-color:rgba(var(--acr),.55); color:var(--ac);
  background:rgba(var(--acr),.04); transform:translateY(-2px);
}

/* =========================================
   THEME SELECTOR CARDS
   ========================================= */
.theme-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
}
.theme-card {
  border-radius:13px; padding:11px; cursor:pointer;
  border:1.5px solid var(--card-br); background:var(--card);
  display:flex; flex-direction:column; align-items:center; gap:9px;
  font-size:11px; font-weight:600; color:var(--tx2);
  transition:all .18s;
}
.theme-card:hover { transform:translateY(-2px); color:var(--tx); border-color:var(--tx3); }
.theme-card.is-active {
  border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(var(--acr),.15);
  color:var(--tx);
}
.theme-preview {
  width:100%; height:36px; border-radius:9px;
  border:1px solid rgba(20,24,44,.08);
}

/* =========================================
   RANGE SLIDER
   ========================================= */
.range-row { display:flex; align-items:center; gap:10px; margin:6px 0 13px; }
.range-row label { font-size:11px; color:var(--tx2); font-weight:600; min-width:90px; }
.range-row input[type=range] {
  flex:1; -webkit-appearance:none; height:5px; border-radius:4px;
  background:var(--card-br); outline:none; cursor:pointer;
}
.range-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:var(--ac); border:2.5px solid var(--card);
  box-shadow:0 1px 4px rgba(20,24,44,.25); cursor:pointer;
  transition:transform .15s;
}
.range-row input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.15); }
.range-val { font-size:11px; color:var(--ac); font-weight:700; min-width:36px; text-align:right; font-family:var(--mono); }

/* =========================================
   COLOR ROW
   ========================================= */
.color-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 0; border-bottom:1px solid var(--divider);
}
.color-row label { font-size:11.5px; color:var(--tx2); font-weight:600; }
.color-row input[type=color] {
  width:44px; height:30px; border:1.5px solid var(--card-br);
  border-radius:9px; background:var(--card); padding:2px; cursor:pointer; transition:.16s;
}
.color-row input[type=color]:hover { border-color:var(--ac); transform:scale(1.04); }

/* =========================================
   TOASTS
   ========================================= */
#toasts {
  position:fixed; bottom:18px; right:18px;
  display:flex; flex-direction:column-reverse; gap:8px;
  z-index:8000; pointer-events:none;
}
.toast {
  background:var(--card); border:1px solid var(--card-br);
  border-left:3px solid var(--ac); padding:12px 16px; border-radius:11px;
  color:var(--tx); font-size:12px; font-weight:600; font-family:var(--font);
  box-shadow:0 12px 32px rgba(20,24,44,.18);
  animation:toastIn .3s cubic-bezier(.22,1,.36,1);
  max-width:420px;
}
.toast.toast-err { border-left-color:var(--red); }
.toast.toast-ok  { border-left-color:var(--grn); }
@keyframes toastIn {
  from { opacity:0; transform:translateX(36px) scale(.96); }
  to   { opacity:1; transform:translateX(0)    scale(1);  }
}

/* =========================================
   MODAL
   ========================================= */
#modal-overlay {
  position:fixed; inset:0; z-index:8888;
  background:rgba(13,19,32,.45);
  -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
  display:none; align-items:center; justify-content:center;
}
#modal-overlay.is-open { display:flex; }
.modal-box {
  background:var(--card); border:1px solid var(--card-br);
  border-radius:18px; padding:24px; width:460px; max-width:92vw;
  box-shadow:0 30px 80px rgba(13,19,32,.4);
  animation:modalIn .24s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn {
  from { opacity:0; transform:scale(.94) translateY(10px); }
  to   { opacity:1; transform:scale(1)   translateY(0); }
}
.modal-title {
  font-size:14.5px; font-weight:700; color:var(--tx);
  margin-bottom:18px; display:flex; align-items:center; gap:9px;
}
.modal-close {
  margin-left:auto; width:26px; height:26px; border-radius:8px; cursor:pointer;
  background:var(--btn-soft); border:1px solid var(--card-br);
  color:var(--tx3); display:flex; align-items:center; justify-content:center;
  font-size:12px; transition:.16s;
}
.modal-close:hover { background:rgba(var(--redr),.1); color:var(--red); border-color:rgba(var(--redr),.3); }

/* =========================================
   BIND CARDS + BADGES
   ========================================= */
.bind-item {
  background:var(--card); border:1px solid var(--card-br);
  border-radius:13px; padding:13px 15px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 1px 2px rgba(20,24,44,.04);
  cursor:pointer; transition:all .18s;
}
.bind-item:hover {
  border-color:rgba(var(--acr),.4); transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(20,24,44,.08);
}
.bind-ico { font-size:21px; flex-shrink:0; width:30px; text-align:center; }
.bind-label { font-size:13px; font-weight:700; color:var(--tx); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bind-meta { font-size:10px; color:var(--tx3); font-family:var(--mono); margin-top:3px; display:flex; align-items:center; gap:6px; }
.bind-del {
  margin-left:auto; width:28px; height:28px; border-radius:8px; flex-shrink:0;
  background:transparent; border:1px solid transparent;
  color:var(--tx3); font-size:12px;
  display:flex; align-items:center; justify-content:center; transition:.16s; cursor:pointer;
}
.bind-del:hover { background:rgba(var(--redr),.1); border-color:rgba(var(--redr),.25); color:var(--red); }

.badge {
  font-size:8.5px; letter-spacing:1.2px; padding:2px 7px; border-radius:5px;
  font-family:var(--mono); font-weight:700; text-transform:uppercase;
}
.badge-bypass { background:rgba(var(--grnr),.12); color:var(--grn); border:1px solid rgba(var(--grnr),.28); }
.badge-direct { background:var(--btn-soft); color:var(--tx3); border:1px solid var(--card-br); }

.bind-badge { font-size:8.5px; letter-spacing:1.2px; padding:2px 7px; border-radius:5px; font-family:var(--mono); font-weight:700; text-transform:uppercase; }

/* =========================================

   ========================================= */
.hero-card {

}
.hero-left { display:flex; align-items:center; gap:12px; flex:1; min-width:220px; }
.hero-dot {
  width:12px; height:12px; border-radius:50%; background:var(--red);
  flex-shrink:0; transition:all .4s;
}
.hero-title { font-size:14.5px; font-weight:700; color:var(--tx); margin-bottom:2px; }
.hero-state { font-size:10px; letter-spacing:1.5px; font-weight:700; margin-left:6px; }
.hero-sub { font-size:11px; color:var(--tx3); }
.hero-btns { display:flex; gap:8px; }

.home-sites { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
.site-card { padding:15px 16px; }
.site-card-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.site-icon {
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.site-name { font-size:13.5px; font-weight:700; color:var(--tx); }

.home-site-card { padding:15px 16px; }
.home-site-btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.home-site-btns button {
  background:var(--input-bg); border:1px solid var(--card-br);
  color:var(--tx2); border-radius:8px; padding:7px 8px;
  font-size:10.5px; font-weight:600; font-family:var(--font); cursor:pointer; transition:all .16s;
}
.home-site-btns button:hover {
  background:rgba(var(--acr),.08); border-color:rgba(var(--acr),.35);
  color:var(--ac);
}
.home-site-btns button:active { transform:scale(.97); }

.home-tools { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }

/* =========================================
   GLow DIVIDER (теперь просто тонкая линия)
   ========================================= */
.glow-sep { height:1px; margin:18px 0; background:var(--divider); }

/* =========================================
   TOGGLE SWITCH
   ========================================= */
.toggle-sw { position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; }
.toggle-sw input { opacity:0; width:0; height:0; }
.toggle-knob {
  position:absolute; inset:0; border-radius:22px; cursor:pointer;
  background:#cfd5e1; transition:all .22s;
}
body.th-night .toggle-knob { background:#33405c; }
.toggle-knob::before {
  content:''; position:absolute; left:3px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(20,24,44,.3); transition:all .22s;
}
.toggle-sw input:checked + .toggle-knob { background:var(--ac); }
.toggle-sw input:checked + .toggle-knob::before { left:calc(100% - 19px); }

/* =========================================
   STAGGER ANIMATION HELPERS
   ========================================= */
.stagger > * { animation:staggerIn .32s cubic-bezier(.22,1,.36,1) both; }
.stagger > *:nth-child(1)  { animation-delay:.03s; }
.stagger > *:nth-child(2)  { animation-delay:.06s; }
.stagger > *:nth-child(3)  { animation-delay:.09s; }
.stagger > *:nth-child(4)  { animation-delay:.12s; }
.stagger > *:nth-child(5)  { animation-delay:.15s; }
.stagger > *:nth-child(6)  { animation-delay:.18s; }
@keyframes staggerIn {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

/* =========================================
   DIAG ROWS
   ========================================= */
.diag-row {
  display:flex; align-items:center; gap:12px;
  padding:8px 12px; border-radius:9px;
  background:var(--input-bg); border:1px solid var(--divider);
  transition:.16s;
}
.diag-row:hover { background:var(--row-hover); }
.diag-icon { font-size:14px; flex-shrink:0; width:20px; text-align:center; }
.diag-name { flex:1; font-size:11.5px; font-weight:700; color:var(--tx); }
.diag-ver  { font-size:10.5px; color:var(--tx3); font-family:var(--mono); min-width:90px; text-align:right; }
.diag-status { font-size:10.5px; font-family:var(--mono); min-width:76px; text-align:right; font-weight:700; }
.diag-status.ok   { color:var(--grn); }
.diag-status.warn { color:var(--ylw); }
.diag-status.err  { color:var(--red); }
.diag-status.wait { color:var(--ac); }
.diag-row-placeholder { font-size:11.5px; color:var(--tx3); padding:10px 0; text-align:center; }
.diag-log-ok   { color:var(--grn); }
.diag-log-warn { color:var(--ylw); }
.diag-log-err  { color:var(--red); }
.diag-log-info { color:var(--tx2); }
.diag-log-step { color:var(--ac); font-weight:700; }

/* =========================================
   CHEBURNET
   ========================================= */
.cbn-test-row {
  display:flex; align-items:center; gap:9px; padding:7px 10px;
  border-radius:9px; background:var(--input-bg);
  border:1px solid var(--divider); font-size:11px; font-weight:600;
  transition:all .2s;
}
.cbn-dot {
  width:9px; height:9px; border-radius:50%; flex-shrink:0;
  background:#c7cdd9; transition:all .4s;
}
body.th-night .cbn-dot { background:#39445c; }
.cbn-dot.ok   { background:var(--grn); }
.cbn-dot.err  { background:var(--red); }
.cbn-dot.wait { background:var(--ylw); animation:dotPulse 1s infinite; }

.cbn-info-box {
  background:rgba(var(--acr),.05); border:1px solid rgba(var(--acr),.16);
  border-radius:10px; padding:11px 12px; font-size:10.5px; color:var(--tx2);
  line-height:1.7; margin-top:4px;
}

/* =========================================
   HOSTS LIST (adblock)
   ========================================= */
.hosts-list-box {
  max-height:200px; overflow-y:auto;
  background:var(--input-bg); border:1px solid var(--divider);
  border-radius:10px; padding:8px 10px; margin-bottom:14px;
  font-family:var(--mono); font-size:10.5px;
}
.hosts-list-box::-webkit-scrollbar { width:8px; }
.hosts-list-box::-webkit-scrollbar-thumb { background:var(--card-br); border-radius:4px; }
.hosts-row { display:flex; align-items:center; justify-content:space-between; padding:3px 6px; border-radius:6px; transition:.14s; }
.hosts-row:hover { background:var(--row-hover); }
.hosts-del { cursor:pointer; color:var(--tx3); padding:0 5px; font-size:11px; transition:.14s; }
.hosts-del:hover { color:var(--red); }

/* =========================================
   LOG VIEWER
   ========================================= */
.log-view {
  font-family:var(--mono); font-size:10.5px; line-height:1.8;
  max-height:calc(100vh - 260px); overflow-y:auto; padding:12px 14px;
}
.log-view::-webkit-scrollbar { width:8px; }
.log-view::-webkit-scrollbar-thumb { background:var(--card-br); border-radius:4px; }
.log-row { display:flex; gap:8px; align-items:baseline; padding:2.5px 0; border-bottom:1px solid var(--divider); }
.log-time { color:var(--tx3); font-size:9.5px; flex-shrink:0; width:52px; }
.log-browser { font-size:9.5px; font-weight:700; flex-shrink:0; width:46px; }
.log-profile { color:var(--ac); font-size:9.5px; flex-shrink:0; width:76px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.log-msg { flex:1; word-break:break-all; color:var(--tx); }
.log-msg.err { color:var(--red); }
.log-msg.ok  { color:var(--grn); }

/* =========================================
   PROGRESS BAR
   ========================================= */
.progress-track {
  background:var(--input-bg); border:1px solid var(--divider);
  border-radius:6px; height:8px; overflow:hidden;
}
.progress-fill {
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--ac), var(--ac2));
  transition:width .4s ease; border-radius:6px;
}

/* =========================================
   MONO LOG BOXES (diag / zapret update)
   ========================================= */
.mono-box {
  background:var(--input-bg); border:1px solid var(--divider);
  border-radius:10px; padding:10px 12px;
  font-family:var(--mono); font-size:10.5px; line-height:1.85;
  overflow-y:auto;
}
.mono-box::-webkit-scrollbar { width:8px; }
.mono-box::-webkit-scrollbar-thumb { background:var(--card-br); border-radius:4px; }

/* =========================================
   TG / SUPPORT CARD
   ========================================= */
.tg-card {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  background:rgba(var(--acr),.06); border:1px solid rgba(var(--acr),.2);

}
.tg-card:hover { background:rgba(var(--acr),.12); border-color:rgba(var(--acr),.4); transform:translateY(-2px); }
.tg-title { font-size:13px; font-weight:700; color:var(--ac); letter-spacing:.6px; }
.tg-sub { font-size:10.5px; color:var(--tx3); font-family:var(--mono); margin-top:2px; }
.tg-arrow { margin-left:auto; color:var(--ac); font-size:15px; }

/* =========================================
   СИСТЕМНЫЕ БАННЕРЫ (нет прав / нет моста API)
